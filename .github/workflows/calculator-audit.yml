name: Calculator Audit

on:
  push:
    branches:
      - calculator-audit-20260806
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate calculator audit
        run: node scripts/generate-calculator-audit.mjs

      - name: Upload compact audit
        uses: actions/upload-artifact@v4
        with:
          name: calculator-audit-compact
          path: public/__calculator_audit_compact.json
          if-no-files-found: error
          retention-days: 3
